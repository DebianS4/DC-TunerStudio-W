name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build static web app
        run: npm run build
        env:
          STATIC_BUILD: '1'

      - name: Copy build into Electron
        run: |
          if (Test-Path electron/web) { Remove-Item -Recurse -Force electron/web }
          New-Item -ItemType Directory electron/web | Out-Null
          Copy-Item -Recurse .output/public/* electron/web
          if (-not (Test-Path electron/web/index.html)) { throw 'No se generó index.html' }

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build installer
        working-directory: electron
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC-Tuner-Studio-Windows
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/release/*.exe
